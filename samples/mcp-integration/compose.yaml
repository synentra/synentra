services:
  mcp-server:
    build: .
    ports:
      - "3001:3001"
    networks: [agent-net]

  synentra:
    image: ghcr.io/synentra/synentra:latest
    ports:
      - "7080:7080"
    volumes:
      - ./config/appsettings.json:/app/appsettings.json:ro
      - ./policies:/app/policies:ro
    networks: [agent-net]

networks:
  agent-net: